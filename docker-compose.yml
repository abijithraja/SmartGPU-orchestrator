version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: smartgpu
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    command: uvicorn app:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/smartgpu
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: supersecretkey-change-in-production
      MODEL_PATH: /app/training/ppo_smartgpu.zip
      COLD_START_THRESHOLD: "500"
    depends_on:
      - db
      - redis
    volumes:
      - .:/app

  worker:
    build: ./backend
    command: celery -A celery_app.celery worker --loglevel=info --pool=solo
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/smartgpu
      REDIS_URL: redis://redis:6379/0
      MODEL_PATH: /app/training/ppo_smartgpu.zip
      COLD_START_THRESHOLD: "500"
    depends_on:
      - db
      - redis
    volumes:
      - .:/app

  beat:
    build: ./backend
    command: celery -A celery_app.celery beat --loglevel=info
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/smartgpu
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
    volumes:
      - .:/app

volumes:
  postgres_data:
