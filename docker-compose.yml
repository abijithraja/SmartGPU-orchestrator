
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: smartgpu
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d smartgpu"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: smartgpu-backend
    working_dir: /app/backend
    command: uvicorn app:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/smartgpu
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: supersecretkey-change-in-production
      MODEL_PATH: /app/training/ppo_smartgpu.zip
      COLD_START_THRESHOLD: "1"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - .:/app


  worker1:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: smartgpu-worker1
    working_dir: /app/backend
    user: "1000:1000"
    command: celery -A celery_app.celery worker --concurrency=1 --loglevel=info
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/smartgpu
      REDIS_URL: redis://redis:6379/0
      MODEL_PATH: /app/rl_engine/models/ppo_smartgpu
      COLD_START_THRESHOLD: "1"
      MPLCONFIGDIR: /tmp/matplotlib
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - .:/app

  worker2:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: smartgpu-worker2
    working_dir: /app/backend
    user: "1000:1000"
    command: celery -A celery_app.celery worker --concurrency=1 --loglevel=info
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/smartgpu
      REDIS_URL: redis://redis:6379/0
      MODEL_PATH: /app/rl_engine/models/ppo_smartgpu
      COLD_START_THRESHOLD: "1"
      MPLCONFIGDIR: /tmp/matplotlib
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - .:/app

  worker3:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: smartgpu-worker3
    working_dir: /app/backend
    user: "1000:1000"
    command: celery -A celery_app.celery worker --concurrency=1 --loglevel=info
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/smartgpu
      REDIS_URL: redis://redis:6379/0
      MODEL_PATH: /app/rl_engine/models/ppo_smartgpu
      COLD_START_THRESHOLD: "1"
      MPLCONFIGDIR: /tmp/matplotlib
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - .:/app

  worker4:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: smartgpu-worker4
    working_dir: /app/backend
    user: "1000:1000"
    command: celery -A celery_app.celery worker --concurrency=1 --loglevel=info
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/smartgpu
      REDIS_URL: redis://redis:6379/0
      MODEL_PATH: /app/rl_engine/models/ppo_smartgpu
      COLD_START_THRESHOLD: "1"
      MPLCONFIGDIR: /tmp/matplotlib
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - .:/app

  beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: smartgpu-beat
    working_dir: /app/backend
    command: celery -A celery_app.celery beat --loglevel=info
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/smartgpu
      REDIS_URL: redis://redis:6379/0
      MPLCONFIGDIR: /tmp/matplotlib
    depends_on:
      redis:
        condition: service_started
    volumes:
      - .:/app

  frontend:
    build: ./frontend
    container_name: smartgpu-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  prometheus:
    image: prom/prometheus:latest
    container_name: smartgpu-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - backend
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: smartgpu-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  postgres_data: