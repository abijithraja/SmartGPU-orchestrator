version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: smartgpu
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  worker:
    build: ./backend
    command: celery -A celery_app.celery worker --loglevel=info
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/smartgpu
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
      - db
