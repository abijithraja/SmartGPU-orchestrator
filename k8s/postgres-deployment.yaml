apiVersion: apps/v1
kind: Deployment
metadata:
  name: smartgpu-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smartgpu-postgres
  template:
    metadata:
      labels:
        app: smartgpu-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: user
            - name: POSTGRES_PASSWORD
              value: password
            - name: POSTGRES_DB
              value: smartgpu
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          emptyDir: {}
