apiVersion: v1
kind: Service
metadata:
  name: smartgpu-frontend
spec:
  type: NodePort
  selector:
    app: smartgpu-frontend
  ports:
    - name: http
      port: 80
      targetPort: 5173
      nodePort: 30080
---
apiVersion: v1
kind: Service
metadata:
  name: smartgpu-backend
spec:
  type: ClusterIP
  selector:
    app: smartgpu-backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: smartgpu-postgres
spec:
  type: ClusterIP
  selector:
    app: smartgpu-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: smartgpu-redis
spec:
  type: ClusterIP
  selector:
    app: smartgpu-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
