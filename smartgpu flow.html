<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartGPU — Final Complete Flow</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f5f4ef;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1rem;
  }

  h1 {
    font-size: 1.4rem;
    font-weight: 500;
    color: #1a1a18;
    margin-bottom: 0.4rem;
    letter-spacing: -0.02em;
  }

  p.sub {
    font-size: 0.85rem;
    color: #6b6a64;
    margin-bottom: 2rem;
  }

  .card {
    background: #fff;
    border: 0.5px solid rgba(0,0,0,0.12);
    border-radius: 16px;
    padding: 2rem;
    max-width: 760px;
    width: 100%;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }

  svg text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  svg .th  { font-size: 14px; font-weight: 500; fill: inherit; }
  svg .ts  { font-size: 12px; font-weight: 400; fill: inherit; }

  /* color ramps */
  svg .c-purple rect, svg .c-purple circle, svg .c-purple ellipse { fill: #EEEDFE; stroke: #534AB7; }
  svg .c-purple text { fill: #3C3489; }
  svg .c-teal   rect, svg .c-teal   circle, svg .c-teal   ellipse { fill: #E1F5EE; stroke: #0F6E56; }
  svg .c-teal   text { fill: #085041; }
  svg .c-amber  rect, svg .c-amber  circle, svg .c-amber  ellipse { fill: #FAEEDA; stroke: #854F0B; }
  svg .c-amber  text { fill: #633806; }
  svg .c-blue   rect, svg .c-blue   circle, svg .c-blue   ellipse { fill: #E6F1FB; stroke: #185FA5; }
  svg .c-blue   text { fill: #0C447C; }
  svg .c-green  rect, svg .c-green  circle, svg .c-green  ellipse { fill: #EAF3DE; stroke: #3B6D11; }
  svg .c-green  text { fill: #27500A; }
  svg .c-red    rect, svg .c-red    circle, svg .c-red    ellipse { fill: #FCEBEB; stroke: #A32D2D; }
  svg .c-red    text { fill: #791F1F; }
  svg .c-coral  rect, svg .c-coral  circle, svg .c-coral  ellipse { fill: #FAECE7; stroke: #993C1D; }
  svg .c-coral  text { fill: #712B13; }
  svg .c-gray   rect, svg .c-gray   circle, svg .c-gray   ellipse { fill: #F1EFE8; stroke: #5F5E5A; }
  svg .c-gray   text { fill: #444441; }
  svg .box      { fill: #F1EFE8; stroke: rgba(0,0,0,0.18); }

  svg .arr { stroke: #888780; stroke-width: 1.5; fill: none; }
  svg .node { cursor: pointer; }
  svg .node:hover { opacity: 0.82; }

  .legend-row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px 20px;
    margin-top: 1.5rem;
    padding-top: 1rem;
    border-top: 0.5px solid rgba(0,0,0,0.1);
    font-size: 12px;
    color: #444;
  }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .legend-dot  { width: 11px; height: 11px; border-radius: 3px; flex-shrink: 0; }
  .ld-purple { background: #EEEDFE; border: 1.5px solid #534AB7; }
  .ld-teal   { background: #E1F5EE; border: 1.5px solid #0F6E56; }
  .ld-amber  { background: #FAEEDA; border: 1.5px solid #854F0B; }
  .ld-blue   { background: #E6F1FB; border: 1.5px solid #185FA5; }
  .ld-green  { background: #EAF3DE; border: 1.5px solid #3B6D11; }
  .ld-red    { background: #FCEBEB; border: 1.5px solid #A32D2D; }
  .ld-coral  { background: #FAECE7; border: 1.5px solid #993C1D; }
  .ld-gray   { background: #F1EFE8; border: 1.5px solid #5F5E5A; }
</style>
</head>
<body>

<h1>SmartGPU Orchestrator</h1>
<p class="sub">Complete system flow — start to end</p>

<div class="card">
<svg width="100%" viewBox="0 0 680 2040" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
  <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<!-- START -->
<g class="c-gray">
  <rect x="255" y="24" width="170" height="38" rx="19" stroke-width="0.5"/>
  <text class="th" x="340" y="43" text-anchor="middle" dominant-baseline="central">Start</text>
</g>
<line x1="340" y1="62" x2="340" y2="90" class="arr" marker-end="url(#arrow)"/>

<!-- 1. USER SUBMITS -->
<g class="node c-purple">
  <rect x="185" y="90" width="310" height="52" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="110" text-anchor="middle" dominant-baseline="central">User submits job</text>
  <text class="ts" x="340" y="128" text-anchor="middle" dominant-baseline="central">Web UI · CLI · REST API</text>
</g>
<line x1="340" y1="142" x2="340" y2="170" class="arr" marker-end="url(#arrow)"/>

<!-- 2. FASTAPI -->
<g class="node c-purple">
  <rect x="185" y="170" width="310" height="52" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="190" text-anchor="middle" dominant-baseline="central">FastAPI backend</text>
  <text class="ts" x="340" y="208" text-anchor="middle" dominant-baseline="central">Auth · validate · assign job ID</text>
</g>
<line x1="340" y1="222" x2="340" y2="250" class="arr" marker-end="url(#arrow)"/>

<!-- 3. REDIS QUEUE -->
<g class="node c-purple">
  <rect x="185" y="250" width="310" height="52" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="270" text-anchor="middle" dominant-baseline="central">Redis job queue</text>
  <text class="ts" x="340" y="288" text-anchor="middle" dominant-baseline="central">PostgreSQL: status = queued</text>
</g>
<line x1="340" y1="302" x2="340" y2="330" class="arr" marker-end="url(#arrow)"/>

<!-- DIVIDER -->
<rect x="80" y="328" width="520" height="22" rx="4" class="box" stroke-width="0.5"/>
<text class="ts" x="340" y="339" text-anchor="middle" dominant-baseline="central" style="fill:#5F5E5A">AI engine picks up job from queue</text>
<line x1="340" y1="350" x2="340" y2="378" class="arr" marker-end="url(#arrow)"/>

<!-- 4. COLD START CHECK -->
<g class="node c-gray">
  <rect x="200" y="378" width="280" height="44" rx="22" stroke-width="0.5"/>
  <text class="th" x="340" y="400" text-anchor="middle" dominant-baseline="central">Experience rows >= 500?</text>
</g>

<!-- NO: round-robin -->
<path d="M200 400 L108 400 L108 466" fill="none" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>
<text class="ts" x="152" y="394" text-anchor="middle" style="fill:#5F5E5A">no</text>
<g class="node c-coral">
  <rect x="48" y="466" width="120" height="52" rx="8" stroke-width="0.5"/>
  <text class="th" x="108" y="486" text-anchor="middle" dominant-baseline="central">Round-robin</text>
  <text class="ts" x="108" y="504" text-anchor="middle" dominant-baseline="central">fallback, log row</text>
</g>

<!-- YES: collect metrics -->
<path d="M480 400 L572 400 L572 466" fill="none" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>
<text class="ts" x="528" y="394" text-anchor="middle" style="fill:#5F5E5A">yes</text>
<g class="node c-teal">
  <rect x="512" y="466" width="120" height="52" rx="8" stroke-width="0.5"/>
  <text class="th" x="572" y="486" text-anchor="middle" dominant-baseline="central">Collect GPU</text>
  <text class="ts" x="572" y="504" text-anchor="middle" dominant-baseline="central">metrics · Prometheus</text>
</g>

<!-- Both merge to state vector -->
<path d="M108 518 L108 556 L185 556" fill="none" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>
<path d="M572 518 L572 556 L495 556" fill="none" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>

<!-- 5. BUILD STATE VECTOR -->
<g class="node c-teal">
  <rect x="185" y="534" width="310" height="52" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="554" text-anchor="middle" dominant-baseline="central">Build state vector</text>
  <text class="ts" x="340" y="572" text-anchor="middle" dominant-baseline="central">GPU metrics + job requirements</text>
</g>
<line x1="340" y1="586" x2="340" y2="614" class="arr" marker-end="url(#arrow)"/>

<!-- 6. RL AGENT -->
<g class="node c-amber">
  <rect x="165" y="614" width="350" height="52" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="634" text-anchor="middle" dominant-baseline="central">RL agent (PPO) scores all GPUs</text>
  <text class="ts" x="340" y="652" text-anchor="middle" dominant-baseline="central">Output: confidence score per GPU</text>
</g>
<line x1="340" y1="666" x2="340" y2="694" class="arr" marker-end="url(#arrow)"/>

<!-- 7. RULE GUARD -->
<g class="node c-gray">
  <rect x="145" y="694" width="390" height="52" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="714" text-anchor="middle" dominant-baseline="central">Rule guard filters candidates</text>
  <text class="ts" x="340" y="732" text-anchor="middle" dominant-baseline="central">Reject: mem_req > free_mem or temp > 85°C</text>
</g>
<line x1="340" y1="746" x2="340" y2="774" class="arr" marker-end="url(#arrow)"/>

<!-- 8. VALID GPU? -->
<g class="node c-gray">
  <rect x="215" y="774" width="250" height="44" rx="22" stroke-width="0.5"/>
  <text class="th" x="340" y="796" text-anchor="middle" dominant-baseline="central">Valid GPU remaining?</text>
</g>

<!-- NO: hold -->
<path d="M215 796 L108 796 L108 848" fill="none" stroke="#A32D2D" stroke-width="0.5" marker-end="url(#arrow)"/>
<text class="ts" x="158" y="790" text-anchor="middle" style="fill:#A32D2D">no</text>
<g class="node c-red">
  <rect x="48" y="848" width="120" height="52" rx="8" stroke-width="0.5"/>
  <text class="th" x="108" y="868" text-anchor="middle" dominant-baseline="central">Hold in queue</text>
  <text class="ts" x="108" y="886" text-anchor="middle" dominant-baseline="central">retry in 60s</text>
</g>
<path d="M48 874 L30 874 L30 720 L145 720" fill="none" stroke="#A32D2D" stroke-width="0.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

<!-- YES: top valid GPU -->
<path d="M465 796 L572 796 L572 848" fill="none" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>
<text class="ts" x="520" y="790" text-anchor="middle" style="fill:#5F5E5A">yes</text>
<g class="node c-amber">
  <rect x="512" y="848" width="120" height="52" rx="8" stroke-width="0.5"/>
  <text class="th" x="572" y="868" text-anchor="middle" dominant-baseline="central">Top valid GPU</text>
  <text class="ts" x="572" y="886" text-anchor="middle" dominant-baseline="central">selected</text>
</g>

<!-- Both merge to explainability -->
<path d="M572 900 L572 936 L495 936" fill="none" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>
<path d="M108 900 L108 936 L185 936" fill="none" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>

<!-- 9. EXPLAINABILITY -->
<g class="node c-amber">
  <rect x="185" y="914" width="310" height="52" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="934" text-anchor="middle" dominant-baseline="central">Explainability engine</text>
  <text class="ts" x="340" y="952" text-anchor="middle" dominant-baseline="central">Why this GPU? Score breakdown</text>
</g>
<line x1="340" y1="966" x2="340" y2="994" class="arr" marker-end="url(#arrow)"/>

<!-- 10. COST ESTIMATE -->
<g class="node c-amber">
  <rect x="185" y="994" width="310" height="52" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="1014" text-anchor="middle" dominant-baseline="central">Cost estimate computed</text>
  <text class="ts" x="340" y="1032" text-anchor="middle" dominant-baseline="central">Azure rate × predicted duration</text>
</g>
<line x1="340" y1="1046" x2="340" y2="1074" class="arr" marker-end="url(#arrow)"/>

<!-- 11. LOG EXPERIENCE -->
<g class="node c-teal">
  <rect x="185" y="1074" width="310" height="52" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="1094" text-anchor="middle" dominant-baseline="central">Log experience row</text>
  <text class="ts" x="340" y="1112" text-anchor="middle" dominant-baseline="central">State · action · baseline cost</text>
</g>
<line x1="340" y1="1126" x2="340" y2="1154" class="arr" marker-end="url(#arrow)"/>

<!-- DIVIDER -->
<rect x="80" y="1152" width="520" height="22" rx="4" class="box" stroke-width="0.5"/>
<text class="ts" x="340" y="1163" text-anchor="middle" dominant-baseline="central" style="fill:#5F5E5A">Kubernetes schedules pod onto selected GPU node</text>
<line x1="340" y1="1174" x2="340" y2="1202" class="arr" marker-end="url(#arrow)"/>

<!-- 12. DOCKER + K8S -->
<g class="node c-blue">
  <rect x="185" y="1202" width="310" height="52" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="1222" text-anchor="middle" dominant-baseline="central">Job runs in Docker container</text>
  <text class="ts" x="340" y="1240" text-anchor="middle" dominant-baseline="central">Resource limits enforced by K8s</text>
</g>
<line x1="340" y1="1254" x2="340" y2="1282" class="arr" marker-end="url(#arrow)"/>

<!-- 13. HEALTH CHECK -->
<g class="node c-gray">
  <rect x="185" y="1282" width="310" height="52" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="1302" text-anchor="middle" dominant-baseline="central">Health check every 30s</text>
  <text class="ts" x="340" y="1320" text-anchor="middle" dominant-baseline="central">Celery beat · GPU + pod status</text>
</g>
<line x1="340" y1="1334" x2="340" y2="1362" class="arr" marker-end="url(#arrow)"/>

<!-- 14. GPU HEALTHY? -->
<g class="node c-gray">
  <rect x="215" y="1362" width="250" height="44" rx="22" stroke-width="0.5"/>
  <text class="th" x="340" y="1384" text-anchor="middle" dominant-baseline="central">GPU still healthy?</text>
</g>

<!-- NO: failure recovery -->
<path d="M215 1384 L108 1384 L108 1450" fill="none" stroke="#A32D2D" stroke-width="0.5" marker-end="url(#arrow)"/>
<text class="ts" x="158" y="1378" text-anchor="middle" style="fill:#A32D2D">no</text>
<g class="node c-red">
  <rect x="48" y="1450" width="120" height="52" rx="8" stroke-width="0.5"/>
  <text class="th" x="108" y="1470" text-anchor="middle" dominant-baseline="central">GPU failed</text>
  <text class="ts" x="108" y="1488" text-anchor="middle" dominant-baseline="central">AI reschedules</text>
</g>
<path d="M48 1476 L22 1476 L22 720 L145 720" fill="none" stroke="#A32D2D" stroke-width="0.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text class="ts" x="28" y="1095" text-anchor="start" style="fill:#A32D2D">retry</text>
<text class="ts" x="28" y="1110" text-anchor="start" style="fill:#A32D2D">max 3</text>

<!-- YES: prometheus -->
<path d="M465 1384 L572 1384 L572 1450" fill="none" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>
<text class="ts" x="520" y="1378" text-anchor="middle" style="fill:#5F5E5A">yes</text>
<g class="node c-green">
  <rect x="512" y="1450" width="120" height="52" rx="8" stroke-width="0.5"/>
  <text class="th" x="572" y="1470" text-anchor="middle" dominant-baseline="central">Prometheus</text>
  <text class="ts" x="572" y="1488" text-anchor="middle" dominant-baseline="central">live GPU metrics</text>
</g>

<!-- Both merge to job completes -->
<path d="M572 1502 L572 1540 L495 1540" fill="none" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>
<path d="M108 1502 L108 1540 L185 1540" fill="none" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>

<!-- 15. JOB COMPLETES -->
<g class="node c-green">
  <rect x="185" y="1518" width="310" height="52" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="1538" text-anchor="middle" dominant-baseline="central">Job completes</text>
  <text class="ts" x="340" y="1556" text-anchor="middle" dominant-baseline="central">Duration · actual cost · OOM flag</text>
</g>
<line x1="340" y1="1570" x2="340" y2="1598" class="arr" marker-end="url(#arrow)"/>

<!-- 16. REWARD -->
<g class="node c-green">
  <rect x="165" y="1598" width="350" height="52" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="1618" text-anchor="middle" dominant-baseline="central">Reward computed · row updated</text>
  <text class="ts" x="340" y="1636" text-anchor="middle" dominant-baseline="central">Speedup vs baseline − OOM penalty</text>
</g>
<line x1="340" y1="1650" x2="340" y2="1678" class="arr" marker-end="url(#arrow)"/>

<!-- 17. DASHBOARD -->
<g class="node c-purple">
  <rect x="185" y="1678" width="310" height="52" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="1698" text-anchor="middle" dominant-baseline="central">Dashboard updates</text>
  <text class="ts" x="340" y="1716" text-anchor="middle" dominant-baseline="central">Cost saved · AI decision · Grafana</text>
</g>
<line x1="340" y1="1730" x2="340" y2="1758" class="arr" marker-end="url(#arrow)"/>

<!-- 18. RETRAIN TRIGGER -->
<g class="node c-amber">
  <rect x="185" y="1758" width="310" height="52" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="1778" text-anchor="middle" dominant-baseline="central">Retrain trigger check</text>
  <text class="ts" x="340" y="1796" text-anchor="middle" dominant-baseline="central">Every 500 new experience rows</text>
</g>

<!-- Retrain loop right -->
<path d="M495 1784 L648 1784 L648 640 L515 640" fill="none" stroke="#BA7517" stroke-width="0.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text class="ts" x="654" y="1200" text-anchor="start" style="fill:#BA7517">model</text>
<text class="ts" x="654" y="1216" text-anchor="start" style="fill:#BA7517">improves</text>

<line x1="340" y1="1810" x2="340" y2="1960" class="arr" marker-end="url(#arrow)"/>

<!-- END -->
<g class="c-gray">
  <rect x="255" y="1960" width="170" height="38" rx="19" stroke-width="0.5"/>
  <text class="th" x="340" y="1979" text-anchor="middle" dominant-baseline="central">End / next job</text>
</g>

</svg>

<div class="legend-row">
  <div class="legend-item"><span class="legend-dot ld-purple"></span>User / UI</div>
  <div class="legend-item"><span class="legend-dot ld-teal"></span>Data / logging</div>
  <div class="legend-item"><span class="legend-dot ld-amber"></span>AI / decisions</div>
  <div class="legend-item"><span class="legend-dot ld-blue"></span>Infrastructure</div>
  <div class="legend-item"><span class="legend-dot ld-green"></span>Monitoring</div>
  <div class="legend-item"><span class="legend-dot ld-red"></span>Recovery</div>
  <div class="legend-item"><span class="legend-dot ld-coral"></span>Cold start</div>
  <div class="legend-item"><span class="legend-dot ld-gray"></span>Guard / check</div>
</div>
</div>

</body>
</html>
